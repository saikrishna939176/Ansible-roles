- name: create aws ec2 & configure godaddy dns record
  hosts: localhost
  gather_facts: false
  vars:
    godaddy_pat: "gd_pat_UetkT8lL8Coo7nM0LdCkgDqqluBaEMed0lmExAiOluv_66ed2b54" 
    domain: "sharada.store"
    record_type: "A"
    instances:
    - db
    - backend
    - frontend
  tasks:
  - name: create ec2_instance
    amazon.aws.ec2_instance:
      
      instance_type: t3.micro
      name: "{{item}}"
      security_groups:
        - sg-060eb715b5128a569
      image_id: "ami-08c46876c64a927b8"
      region: us-east-1
      key_name: "key"
      tags:
        Name: "{{item}}"
      state: running
    loop: "{{ instances }}"
    register: ec2_instances
  - name: print output
    ansible.builtin.debug:
      msg: "{{ ec2_instances }}"

  - name: print output
    ansible.builtin.debug:
      msg: "Instance {{ item.1.tags.Name | default(item.0.item) }} - Public IP: {{ item.1.public_ip_address | default('No public IP assigned') }}"
    loop: "{{ ec2_instances.results | subelements('instances') }}"
