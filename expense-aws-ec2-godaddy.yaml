- name: create aws ec2 & configure godaddy dns record
  hosts: localhost
  gather_facts: false
  vars:
    godaddy_pat: "gd_pat_UetkT8lL8Coo7nM0LdCkgDqqluBaEMed0lmExAiOluv_66ed2b54" 
    domain: "sharada.store"
    record_type: "A"
  tasks:
  - name: create ec2_instance
    amazon.aws.ec2_instance:
      instance_type: t3.micro
      name: "{{item}}"
      security_group:
        - Allow
      image_id: "ami-0bdc7d025135d7b49"
      region: us-east-1
      key_name: "openvpn"
      tags:
        Name: "{{item}}"
    loop:
      - db
      - backend
      - frontend
    register: ec2_instances
