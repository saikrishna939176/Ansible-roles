- name: Update GoDaddy DNS Record using PAT
  hosts: localhost
  gather_facts: false
  vars:
    godaddy_pat: "gd_pat_UetkT8lL8Coo7nM0LdCkgDqqluBaEMed0lmExAiOluv_66ed2b54" 
    domain: "sharada.store"
    record_type: "A"
    record_name: 
    - db
    - backend
    - frontend
    record_data:
    - "1.2.3.4"
    - "1.2.3.6"
    - "1.2.3.7"
  tasks:
    - name: Set DNS record in GoDaddy (v3 API syntax)
      ansible.builtin.uri:
        url: "https://api.godaddy.com/v1/domains/{{ domain }}/records/{{ record_type }}/{{ item.0 }}"
        method: PUT
        headers:
          # Use Bearer instead of sso-key
          Authorization: "Bearer {{ godaddy_pat }}"
          Accept: "application/json"
          Content-Type: "application/json"
        body_format: json
        body:
          - data: "{{ item.1 }}"
            ttl: 600
        status_code: 200
      loop: "{{ record_name | zip(record_data) | list }}"
        
