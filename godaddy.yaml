- name: Update GoDaddy DNS Record using PAT
  hosts: localhost
  gather_facts: false
  vars:
    godaddy_pat: "gd_pat_UetkT8lL8Coo7nM0LdCkgDqqluBaEMed0lmExAiOluv_66ed2b54" 
    domain: "sharada.store"
    record_type: "A"
    record_name: "www"
    record_data: "192.0.2.1"
  tasks:
    - name: Set DNS record in GoDaddy (v3 API syntax)
      ansible.builtin.uri:
        url: "https://api.godaddy.com/v1/domains/{{ domain }}/records/{{ record_type }}/{{ record_name }}"
        method: PUT
        headers:
          # Use Bearer instead of sso-key
          Authorization: "Bearer {{ godaddy_pat }}"
          Accept: "application/json"
          Content-Type: "application/json"
        body_format: json
        body:
          - data: "{{ record_data }}"
            ttl: 600
        status_code: 200
