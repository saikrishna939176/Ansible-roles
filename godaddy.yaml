- name: Practice GoDaddy DNS Record Creation in Sandbox
  hosts: localhost
  gather_facts: false

  vars:
    # 🧪 A default mock domain GoDaddy opens for practice testing in OTE
    target_domain: "example.com"
    dns_record_name: "test"
    dns_record_type: "A"
    dns_record_value: "192.0.2.1"
    dns_record_ttl: 600

  vars_files:
    - godaddy_vault.yaml

  tasks:
    - name: Create DNS Record in Sandbox Environment
      ansible.builtin.uri:
        # ✅ FIX: Pointing to ://ote-godaddy.com using standard example mock domains
        url: "https://://ote-godaddy.com/v3/domains/zones/{{ target_domain }}/dns-records"
        method: POST
        body_format: json
        body:
          name: "{{ dns_record_name }}"
          type: "{{ dns_record_type }}"
          data: "{{ dns_record_value }}"
          ttl: "{{ dns_record_ttl | int }}"
        headers:
          Authorization: "Bearer {{ godaddy_token }}"
          Accept: "application/json"
          Content-Type: "application/json"
          User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        status_code: 
          - 201
      register: dns_response

    - name: Print sandbox success confirmation
      ansible.builtin.debug:
        msg: "Practice DNS Record successfully simulated in Sandbox!"
