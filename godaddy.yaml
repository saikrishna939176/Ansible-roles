  - name: Create DNS Record via Modern GoDaddy v3 API
    ansible.builtin.uri:
      # ✅ HARDCODED FIX: Points strictly to the developer gateway path with no variables
      url: "https://godaddy.com"
      method: POST
      body_format: json
      body:
        name: "test"
        type: "A"
        data: "192.0.2.1"
        ttl: 3600
      headers:
        Authorization: "Bearer {{ godaddy_token }}"
        Accept: "application/json"
        Content-Type: "application/json"
        User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
      status_code: 
        - 201
    register: dns_response
