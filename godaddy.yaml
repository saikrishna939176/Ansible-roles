- name: Automate GoDaddy DNS Record Creation
  hosts: localhost
  gather_facts: false

  vars:
    target_domain: "sharada.store"
    
    dns_record_name: "test"          # Use "test" for test.sharada.store (or "@" for the root domain)
    dns_record_type: "A"             # Record type (A, CNAME, TXT, MX etc.)
    dns_record_value: "192.0.2.1"    # The IP address or target destination
    dns_record_ttl: 600             # Time to Live in seconds (1 hour)

  vars_files:
    - godaddy_vault.yaml

  tasks:
    - name: Create or Update DNS Record via GoDaddy v3 API
      ansible.builtin.uri:
        url: "https://api.godaddy.com/v3/domains/zones/{{ target_domain }}/dns/records"
        method: PUT
        body_format: json
        # ✅ GoDaddy takes an array of record blocks
        body:
          - name: "{{ dns_record_name }}"
            type: "{{ dns_record_type }}"
            data: "{{ dns_record_value }}"
            ttl: "{{ dns_record_ttl | int }}"
        headers:
          Authorization: "Bearer {{ godaddy_token }}"
          Accept: "application/json"
          Content-Type: "application/json"
          # 🛡️ Kept to bypass any Cloudflare edge filters
          User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
        status_code: 
          - 200
          - 204
      register: dns_response

    - name: Print success confirmation
      ansible.builtin.debug:
        msg: "DNS Record for {{ dns_record_name }}.{{ target_domain }} successfully modified!"
