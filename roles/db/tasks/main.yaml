- name: check version is installed or Not
  ansible.builtin.command: sudo mysqld --version
  register: Version
  ignore_errors: true
  changed_when: false

- name: Prompt for MySQL root password
  ansible.builtin.pause:
    prompt: "Please enter MySQL root password"
    echo: false
  register: mysql_password_input
  when: mysql_root_password is not defined

- name: Set MySQL root password variable
  ansible.builtin.set_fact:
    mysql_root_password: "{{ mysql_password_input.user_input }}"
  when: mysql_root_password is not defined

- name: print version info
  ansible.builtin.debug:
    msg: "{{Version}}"

- name: install mysql-community
  ansible.builtin.command: sudo dnf install -y https://dev.mysql.com/get/mysql80-community-release-el9-1.noarch.rpm
  when: Version.rc != 0

- name: import rpm
  ansible.builtin.command: sudo rpm --import https://repo.mysql.com/RPM-GPG-KEY-mysql-2023
  when: Version.rc != 0

- name: install mysql-community
  ansible.builtin.command: sudo dnf install -y mysql-community-server
  when: Version.rc != 0

- name: Run & enable mysql
  ansible.builtin.service:
    name: mysqld
    state: started
    enabled: yes
  become: yes

- name: Ensure python3-pip is installed
  ansible.builtin.dnf:
    name: python3-pip
    state: present
  become: yes
- name: install python mysql dependencies
  ansible.builtin.pip:
    name: 
    - PyMySQL
    - cryptography
    executable: pip3.9

